name: indexcreator-test
services:
  postgres:
    image: postgres:15
    profiles: [postgres]
    environment:
      POSTGRES_USER: indexcreator
      POSTGRES_PASSWORD: IndexCreator_test_only_123
      POSTGRES_DB: IndexCreatorTest
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U indexcreator -d IndexCreatorTest']
      interval: 5s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_ROOT_PASSWORD: IndexCreator_test_only_123
      MYSQL_DATABASE: IndexCreatorTest
    ports: ['127.0.0.1:53306:3306']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD']
      interval: 5s
      timeout: 3s
      retries: 40
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: IndexCreator_test_only_123
    ports: ['127.0.0.1:51433:1433']
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
