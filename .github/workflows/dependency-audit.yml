name: 依存の脆弱性検査
on:
  push:
    branches: ['**']
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
  nuget-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: pwsh -File scripts/nuget-vulnerable-check.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NuGet-audit
          path: artifacts/vulnerable.json
          if-no-files-found: warn
