name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: pwsh -File scripts/test.ps1
      - run: pwsh -File scripts/package.ps1
      - name: サブモジュールが配布物に含まれないことを確認する
        shell: pwsh
        run: |
          if (Get-ChildItem artifacts -Recurse -Filter 'Implem.*') { throw 'Reference source leaked into distribution.' }
      - uses: actions/upload-artifact@v7
        with:
          name: IndexCreator
          path: artifacts/package/*.zip*
          if-no-files-found: error
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dbms: [SQLServer, PostgreSQL, MySQL]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: pwsh -File scripts/test.ps1 -Dbms ${{ matrix.dbms }}
      - name: 検証コンテナの終了
        if: always()
        run: docker compose --profile '*' down -v
  appservice-layout:
    name: App Service 配置（${{ matrix.os }}）
    needs: build-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: IndexCreator
          path: artifacts/package
      - shell: pwsh
        run: ./scripts/appservice-smoke.ps1
