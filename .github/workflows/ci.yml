name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: pwsh -File scripts/test.ps1
      - run: pwsh -File scripts/package.ps1
      - name: サブモジュールが配布物に含まれないことを確認する
        shell: pwsh
        run: |
          if (Get-ChildItem artifacts -Recurse -Filter 'Implem.*') { throw 'Reference source leaked into distribution.' }
      - uses: actions/upload-artifact@v7
        with:
          name: IndexCreator
          path: artifacts/package/*.zip*
          if-no-files-found: error
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dbms: [SQLServer, PostgreSQL, MySQL]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: pwsh -File scripts/test.ps1 -Dbms ${{ matrix.dbms }} -Benchmark
      - name: 検証コンテナの終了
        if: always()
        run: docker compose --profile '*' down -v
  appservice-layout:
    name: App Service 配置（${{ matrix.rid }}）
    needs: build-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: IndexCreator
          path: artifacts/package
      - name: Windows x86 のランタイムを用意する
        if: matrix.rid == 'win-x86'
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installerPath
          pwsh -NoProfile -File $installerPath -Runtime dotnet -Channel 10.0 -Architecture x86 -InstallDir (Join-Path $env:RUNNER_TEMP 'dotnet-x86') -NoPath
          if ($LASTEXITCODE -ne 0) { throw 'Windows x86 runtime installation failed.' }
      - shell: pwsh
        run: |
          $dotnetHostPath = if ('${{ matrix.rid }}' -eq 'win-x86') { Join-Path $env:RUNNER_TEMP 'dotnet-x86/dotnet.exe' } else { 'dotnet' }
          & $dotnetHostPath --info
          ./scripts/appservice-smoke.ps1 -Platform '${{ matrix.rid }}' -DotnetPath $dotnetHostPath
