# 参照用サブモジュール `_reference/Implem.Pleasanter` が、上流の main の先頭より遅れていないかを日次で検出し、
# 遅れていれば Issue と Draft PR を出す。開いている PR があれば、同じ PR へコミットを足してポインタを最新へ進める。
# 追従先はリリースタグではなく main の先頭（2026-10-19 に変更。`_reference/README.md`）。
# main はリリース前の変更を含むので、「どの版か」はコミット SHA と <Version> で言う。
#
# Dependabot（gitsubmodule）は使わない。2026-02 にタグの扱いが変わったばかりで、追従するブランチの決め方と
# 未マージ PR の更新の仕方が公式に書かれておらず、手元で動作を確かめられないため。
#
# PR は GitHub App のトークンで作る（GITHUB_TOKEN で作った PR・push は他のワークフローを起こさず、必須チェックが付かない）。
# Issue の作成だけは GITHUB_TOKEN（issues: write）で行い、App に Issues の権限を足さずに済ませる。
name: 参照サブモジュールの最新化
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-submodule-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}
      latest_ref: ${{ steps.check.outputs.latest_ref }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
      current_tag: ${{ steps.check.outputs.current_tag }}
      current_sha: ${{ steps.check.outputs.current_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false
      - id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/reference-check.ps1
  update:
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Issue の作成だけに使う（GITHUB_TOKEN）。App には Issues の権限を要求しない
      contents: read
      issues: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MY_REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MY_REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
      - shell: pwsh
        env:
          # ブランチの push と PR の作成は App のトークン
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Issue の作成だけは GITHUB_TOKEN（App に Issues の権限を足さないため）
          ISSUE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_REF: ${{ needs.check.outputs.latest_ref }}
          LATEST_TAG: ${{ needs.check.outputs.latest_tag }}
          LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
          LATEST_SHA: ${{ needs.check.outputs.latest_sha }}
          CURRENT_TAG: ${{ needs.check.outputs.current_tag }}
          CURRENT_SHA: ${{ needs.check.outputs.current_sha }}
        run: ./scripts/reference-open-pr.ps1
